# Fine-tuning ColQwen2.5, version 2: more training data than configs/finetune_c.toml
# (v1). Two changes, made together (so their effects can't be told apart):
#   - more companies: the decks added to docs/train_sources.csv after v1
#     (docs/train_sources.md), still none from the evaluation set;
#   - more queries: up to 4 per page instead of 2.
# Everything else is v1's. The validation companies and their queries are fixed to
# v1's, so validation scores of v1 and v2 compare directly. v1 and v2 are each
# trained with seeds 42, 43 and 44 and compared on the mean validation MRR@10; each
# v2 model is evaluated once on the evaluation set. Fixed before the first v2
# training run (2026-11-02).

# The model being fine-tuned: the same checkpoint as configs/method_c.toml.
base = "configs/method_c.toml"

[data]
# All training decks in docs/train_sources.csv (v1's and the added ones).
pages = "data/train/pages.jsonl"
queries = "data/train/queries_v2.jsonl"
triplets = "data/train/triplets_v2.jsonl"

[queries]
# Synthetic training queries, one request per page (scripts/make_train_queries.py).
model = "google/gemini-3.8-flash"
provider = "google-ai-studio"
reasoning_effort = "low"
max_tokens = 2048
queries_per_page = 4
prompt = """
あなたは、企業の決算説明資料を検索する利用者が入力しそうな質問を作ります。画像は{company}の{period}の決算説明資料の1ページです。

このページを見なければ答えられない、具体的な質問を最大{n}個作り、JSON で返してください。
- 質問には会社名と期間（例：2026年3月期、2027年3月期第1四半期）を入れる。
- スライドの見出しや文言をそのまま写さず、利用者が自分の言葉で聞くように書く。
- グラフ・表・図に載っている数値や関係を問う質問を優先する。答えそのものは書かない。
- 画像に書かれていないことを前提にしない。
- 表紙、目次、注意事項、章の区切りなど、具体的に問える内容がないページでは、queries を空のリストにする。
"""

[negatives]
# One hard negative per query: the base model's highest-ranked other page of the
# same company, skipping pages that score >= max_ratio of the positive (they may
# show the same fact). See src/multimodal_rag/finetune/data.py.
max_ratio = 0.95

[split]
# v1's validation companies (sampled there with seed 20261101) and v1's queries for
# them, so v1 and v2 are scored on the same 324 validation queries and 203 pages.
# v2's own queries for these companies are not used.
val_companies = ["daikin", "ntt", "sumitomocorp"]
val_triplets = "data/train/triplets.jsonl"

[train]
# Only the LoRA adapters already in the checkpoint (about 60M parameters) are
# trained; the vision tower and base weights stay frozen.
trainable = "lora"
epochs = 1
batch_size = 16
# GradCache mini-batch: memory per step stays near 9 GiB on the 16 GB GPU.
mini_batch_size = 2
learning_rate = 2e-5
warmup_ratio = 0.05
eval_steps = 0.1
seed = 42
# Best checkpoint by the validation companies' MRR@10.
metric_for_best_model = "eval_val_maxsim_mrr@10"
