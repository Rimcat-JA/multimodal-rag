[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Multimodal RAG over financial-report charts and tables: comparing text extraction, figure captioning, and ColPali-style page-image retrieval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.28.2",
    # ROCm builds for the Radeon RX 9070 XT (gfx1201), served from AMD's index below.
    "streamlit>=1.65.0",
    "torch[device-gfx1201]==2.14.0+rocm10.1.0",
    "torchvision[device-gfx1201]==0.29.0a0+rocm10.1.0",
]

[project.scripts]
multimodal-rag = "multimodal_rag:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Only Windows is set up for ROCm here; don't try to resolve for other platforms.
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
# Use the system Python (installed via winget) and keep the package cache outside
# AppData. Processes launched from packaged apps get AppData writes redirected,
# which hides uv-managed interpreters from normal terminals.
python-preference = "only-system"
# AMD's Windows torch wheel doesn't need triton, but the lock resolver reads the
# Linux wheel's metadata (which pins a Linux-only triton) and fails. Drop it.
exclude-dependencies = ["triton"]

# AMD's index is checked before PyPI, so torch and its rocm-sdk-* / amd-torch-device-*
# dependencies always come from AMD. Anything AMD doesn't host falls through to PyPI.
# Without this, adding a library that depends on torch could pull the CUDA build.
[[tool.uv.index]]
name = "amd-rocm"
url = "https://stable.repo.amd.com/rocm/whl-next/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
